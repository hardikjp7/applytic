<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Applytic</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <div class="logo">A</div>
    <span class="title">applytic</span>
  </div>

  <div id="loading" class="state">
    <div class="spinner"></div>
  </div>

  <div id="main" class="state hidden">
    <!-- Auth status row - single element, content-driven so it's
         impossible to show two contradictory states at once -->
    <div id="auth-row" class="auth-row">
      <span id="auth-dot" class="status-dot status-dot-off"></span>
      <span id="auth-label" class="auth-label">Checking...</span>
      <button id="auth-action-btn" class="link-btn"></button>
    </div>

    <!-- Job detection area -->
    <div id="job-found" class="job-card hidden">
      <p id="dup-warning" class="dup-warning hidden"></p>
      <p class="job-role"></p>
      <p class="job-company"></p>
      <button id="add-btn" class="primary-btn">Add to Applytic</button>
      <p id="add-feedback" class="feedback hidden"></p>
    </div>

    <!-- Pending-queue indicator - only shown when something's unsynced -->
    <div id="queue-indicator" class="queue-row hidden">
      <span id="queue-count-text"></span>
      <button id="manage-queue-btn" class="link-btn">Manage</button>
    </div>

    <div id="job-not-found" class="state hidden">
      <p class="msg">Visit a job posting on LinkedIn, Indeed, or Glassdoor, then open this popup again.</p>
    </div>
  </div>

  <div id="error" class="state hidden">
    <p class="msg error-msg"></p>
    <button id="retry-btn" class="secondary-btn">Try again</button>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
