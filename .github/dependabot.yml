version: 2

updates:
  # CDK dependencies
  - package-ecosystem: npm
    directory: /cdk
    schedule:
      interval: monthly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - chore
    commit-message:
      prefix: 'chore(cdk)'
    groups:
      all-cdk-dependencies:
        patterns:
          - "*"

  # Frontend dependencies
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - chore
    commit-message:
      prefix: 'chore(frontend)'
    groups:
      all-frontend-dependencies:
        patterns:
          - "*"

  # Lambda Python dependencies
  - package-ecosystem: pip
    directory: /lambdas
    schedule:
      interval: monthly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - chore
    commit-message:
      prefix: 'chore(lambda)'
    groups:
      all-lambda-dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - chore
    commit-message:
      prefix: 'chore(ci)'
    groups:
      all-github-actions:
        patterns:
          - "*"