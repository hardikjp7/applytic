    <!-- GitHub Pages SPA routing fix -->
    <script>
      (function() {
        var redirect = sessionStorage.getItem('redirect');
        if (redirect) {
          sessionStorage.removeItem('redirect');
          var base = '/applytic';
          var isRootOnly = redirect === base || redirect === base + '/';
          if (!isRootOnly) {
            window.history.replaceState(null, null, redirect);
          }
        }
      })();
    </script>

    <!-- v2.3: Landing page fonts - Syne (headings) and DM Sans (body).
